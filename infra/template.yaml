AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Independent static hosting and visitor counter for lanceriver.com

Parameters:
  DomainName:
    Type: String
    Default: lanceriver.com
  HostedZoneId:
    Type: String
    Default: Z08238469JD0YFW9R421
  GitHubSubjectPrefix:
    Type: String
    # GitHub's immutable subject claim for lanceriver/lance-portfolio (owner and
    # repo IDs, not names), so a renamed or re-created repo cannot match.
    Default: repo:lanceriver@138498184/lance-portfolio@1372895004
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::319611139788:oidc-provider/token.actions.githubusercontent.com

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        Description: Private S3 access for the portfolio distribution
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-url'
      AutoPublish: true
      FunctionConfig:
        Comment: Canonical URLs and directory index mapping
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          var qs = Object.keys(request.querystring).map(function (key) {
            var item = request.querystring[key];
            var values = item.multiValue || [{ value: item.value }];
            return values.map(function (v) { return key + '=' + v.value; }).join('&');
          }).filter(Boolean).join('&');
          var suffix = qs ? '?' + qs : '';
          if (host === 'www.${DomainName}') return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: 'https://${DomainName}' + request.uri + suffix } } };
          if (request.uri.endsWith('/')) { request.uri += 'index.html'; return request; }
          var last = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (!last.includes('.')) return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: 'https://${DomainName}' + request.uri + '/' + suffix } } };
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: SiteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 404
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 404
            ErrorCachingMinTTL: 60

  SiteDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub 'www.${DomainName}'
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  # Carried over from the old hosted zone (Z045884510L49TOC5SLX0).
  CarriedDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Sub 'blog.${DomainName}'
          Type: CNAME
          TTL: '300'
          ResourceRecords:
            - hashnode.network
        - Name: !Ref DomainName
          Type: TXT
          TTL: '300'
          ResourceRecords:
            - '"google-site-verification=A1fk4wn8_zZKMEJLObv4waDDWXXtDzz9ySccBs1yXAI"'

  VisitsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  VisitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: visits/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt VisitsTable.Arn
      Events:
        GetVisits:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisitsApi
            Path: /visits
            Method: GET
        PostVisits:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisitsApi
            Path: /visits
            Method: POST

  SpotifyNowPlayingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: spotify/
      Handler: spotify_app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 15
      # TODO: re-enable when account quota allows at least 10 unreserved executions.
      # ReservedConcurrentExecutions: 1
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lance-portfolio/spotify/credentials'
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.${AWS::URLSuffix}'
                  kms:EncryptionContext:PARAMETER_ARN: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lance-portfolio/spotify/credentials'
      Events:
        GetNowPlaying:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisitsApi
            Path: /now-playing
            Method: GET

  VisitsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${DomainName}'
          - !Sub 'https://www.${DomainName}'
          - http://localhost:5173
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${GitHubSubjectPrefix}:ref:refs/heads/main'
      Policies:
        - PolicyName: DeployPortfolioSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  VisitsApiUrl:
    Value: !Sub 'https://${VisitsApi}.execute-api.${AWS::Region}.amazonaws.com/visits'
  NowPlayingApiUrl:
    Value: !Sub 'https://${VisitsApi}.execute-api.${AWS::Region}.amazonaws.com/now-playing'
